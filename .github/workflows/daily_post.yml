name: OndoTrip Daily Auto Post (Cloudflare Scheduled)

on:
  workflow_dispatch:
    inputs:
      count:
        description: "생성할 포스트 수"
        required: false
        default: "5"
        type: string
      publish:
        description: "즉시 공개 발행 여부 (기본 false: 임시저장, true면 자동 공개 게시)"
        required: false
        default: false
        type: boolean
      preview_only:
        description: "로컬 HTML 미리보기만 생성 (업로드 없음)"
        required: false
        default: false
        type: boolean
      status_only:
        description: "누적 현황(--status)만 조회"
        required: false
        default: false
        type: boolean
      slack_channel_id:
        description: "결과 보고를 보낼 Slack 채널 또는 DM ID"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: ondotrip-daily-post
  cancel-in-progress: false

jobs:
  run-ondotrip:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.12 설정 및 패키지 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 필수 Secrets 확인 및 Google OAuth 토큰 준비
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          STATUS_ONLY: ${{ inputs.status_only }}
          PREVIEW_ONLY: ${{ inputs.preview_only }}
        run: |
          missing=""
          if [ "$STATUS_ONLY" != "true" ]; then
            [ -z "$TOUR_API_KEY" ] && missing="$missing TOUR_API_KEY"
            if [ "$PREVIEW_ONLY" != "true" ]; then
              [ -z "$BLOGGER_BLOG_ID" ] && missing="$missing BLOGGER_BLOG_ID"
              [ -z "$GOOGLE_TOKEN_JSON" ] && missing="$missing GOOGLE_TOKEN_JSON"
            fi
          fi
          if [ -n "$missing" ]; then
            echo "::error::GitHub Repository Secrets에 다음 필수 항목을 등록해 주세요:$missing"
            exit 1
          fi
          if [ -n "$GOOGLE_TOKEN_JSON" ]; then
            printf '%s' "$GOOGLE_TOKEN_JSON" > token.json
          fi

      - name: OndoTrip 파이프라인 실행
        id: run_main
        env:
          PYTHONIOENCODING: utf-8
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
          TOUR_API_ENDPOINT: https://apis.data.go.kr/B551011/KorService2
          PHOTO_API_KEY: ${{ secrets.PHOTO_API_KEY || secrets.TOUR_API_KEY }}
          PHOTO_API_ENDPOINT: https://apis.data.go.kr/B551011/PhotoGalleryService1
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_URL: ${{ secrets.BLOGGER_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
          INPUT_COUNT: ${{ inputs.count || '5' }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_PREVIEW_ONLY: ${{ inputs.preview_only }}
          INPUT_STATUS_ONLY: ${{ inputs.status_only }}
        run: |
          set -o pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("posted_history.json")
          before_keys = list(json.loads(p.read_text(encoding="utf-8")).keys()) if p.is_file() else []
          Path("/tmp/ondotrip_before.json").write_text(json.dumps(before_keys, ensure_ascii=False), encoding="utf-8")
          PY
          if [ "$INPUT_STATUS_ONLY" = "true" ]; then
            python main.py --status | tee /tmp/ondotrip_run.log
          elif [ "$INPUT_PREVIEW_ONLY" = "true" ]; then
            python main.py --mode auto --count "${INPUT_COUNT}" --preview-only | tee /tmp/ondotrip_run.log
          else
            ARGS=(--mode auto --count "${INPUT_COUNT}")
            if [ "$INPUT_PUBLISH" = "true" ]; then
              ARGS+=(--publish)
            fi
            python main.py "${ARGS[@]}" | tee /tmp/ondotrip_run.log
          fi

      - name: 임시 인증 파일(token.json) 정리
        if: always()
        run: rm -f token.json

      - name: 게시 이력(posted_history.json) 자동 커밋
        if: ${{ inputs.status_only != true && inputs.preview_only != true }}
        run: |
          if ! git diff --quiet posted_history.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add posted_history.json
            git commit -m "chore: update posted_history.json [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Slack 실행 결과 보고
        if: always()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          TARGET_CHANNEL: ${{ inputs.slack_channel_id || secrets.SLACK_REPORT_CHANNEL_ID }}
          JOB_STATUS: ${{ job.status }}
          INPUT_COUNT: ${{ inputs.count || '5' }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_PREVIEW_ONLY: ${{ inputs.preview_only }}
          INPUT_STATUS_ONLY: ${{ inputs.status_only }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          def _esc(val: object) -> str:
              return str(val or "").replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;")

          token = os.environ.get("SLACK_BOT_TOKEN", "").strip()
          channel = os.environ.get("TARGET_CHANNEL", "").strip()
          if not token or not channel:
              print("Slack 토큰 또는 보고 채널이 없어 알림을 건너뜁니다.")
              raise SystemExit(0)

          job_status = os.environ.get("JOB_STATUS", "unknown")
          ok = job_status == "success"
          is_status = os.environ.get("INPUT_STATUS_ONLY") == "true"
          is_preview = os.environ.get("INPUT_PREVIEW_ONLY") == "true"

          before_path = Path("/tmp/ondotrip_before.json")
          before_keys = set(json.loads(before_path.read_text(encoding="utf-8"))) if before_path.is_file() else set()
          hist_path = Path("posted_history.json")
          after_data = json.loads(hist_path.read_text(encoding="utf-8")) if hist_path.is_file() else {}
          if not isinstance(after_data, dict):
              after_data = {}
          new_items = [item for cid, item in after_data.items() if cid not in before_keys and isinstance(item, dict)]

          if not ok:
              badge = f":x: *OndoTrip 클라우드 실행 실패 ({job_status})*"
          elif new_items:
              badge = f":white_check_mark: *OndoTrip 자동 발행 완료 ({len(new_items)}건)*"
          else:
              badge = ":white_check_mark: *OndoTrip 클라우드 실행 완료*"

          if is_status:
              mode_desc = "누적 현황 조회 (--status)"
          elif is_preview:
              mode_desc = f"미리보기 생성 ({os.environ.get('INPUT_COUNT', '5')}건)"
          else:
              pub = "공개 발행" if os.environ.get("INPUT_PUBLISH") == "true" else "임시저장(Draft)"
              mode_desc = f"자동 포스팅 {os.environ.get('INPUT_COUNT', '5')}건 ({pub})"

          msg_lines = [
              badge,
              f"• 작업: {mode_desc}",
          ]

          if new_items:
              msg_lines.append(f"• *이번 실행 발행 글 ({len(new_items)}건)*:")
              for idx, item in enumerate(new_items, start=1):
                  cat = _esc(item.get("category") or "기타")
                  title = _esc(item.get("title") or "(제목 없음)")
                  st = "임시저장" if item.get("is_draft") else "공개 발행"
                  post_url = str(item.get("post_url") or "").strip()
                  link_part = f" — <{post_url}|블로그 글 보기>" if post_url else ""
                  msg_lines.append(f"  {idx}. [{cat}] *{title}* ({st}){link_part}")
              msg_lines.append(f"• 누적 발행: 총 {len(after_data)}건")

          if (not ok) or is_status or is_preview or (not new_items):
              log_path = Path("/tmp/ondotrip_run.log")
              if log_path.is_file():
                  lines = log_path.read_text(encoding="utf-8", errors="replace").splitlines()
                  tail_text = "\n".join(lines[-18:]).strip()
                  if tail_text:
                      msg_lines.append(f"• *실행 요약*:\n```\n{tail_text[:2500]}\n```")

          msg_lines.append(f"<{os.environ.get('RUN_URL', '')}|GitHub Actions 실행 로그 보기>")

          data = json.dumps({"channel": channel, "text": "\n".join(msg_lines)}).encode("utf-8")
          req = urllib.request.Request(
              "https://slack.com/api/chat.postMessage",
              data=data,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json; charset=utf-8",
              },
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=20) as resp:
              print("Slack 응답:", resp.read().decode("utf-8", errors="replace"))
          PY
